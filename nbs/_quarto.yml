            href: "https://github.com/bthek1/bthek1_blog/issues"
          
    tools:
      - icon: github
        href: "https://github.com/bthek1"
        aria-label: Github
      - icon: linkedin
        href: "https://www.linkedin.com/in/benedict-thekkel/"
        aria-label: Linkedin


  page-footer:
    center:
      - text: "About"
        href: "index.ipynb"
      - text: "FAQ"
        href: "https://github.com/bthek1/bthek1_blog/issues"    
      - text: "License"
        href: "https://bthek1.github.io/bthek1_blog/index.html"
      - text: "Trademark"
        href: "index.ipynb"
        
        
    right:
      - icon: github
        href: "https://github.com/bthek1"
        aria-label: Github
      - icon: linkedin
        href: "https://www.linkedin.com/in/benedict-thekkel/"
        aria-label: Linkedin

  comments: 
    utterances:
      repo: quarto-dev/quarto-web
        
  # Visibility rule: only index.ipynb and digit-initial notebooks are public.
  # "p_"-prefixed notebooks (p_04_Pay.ipynb) are private and deliberately fall
  # outside the glob. Note this hides them from the menu only - Quarto still
  # renders and publishes p_*.html.
  sidebar:
    style: floating
    contents:
      - "index.ipynb"
      - auto: "[0-9]*.ipynb"


metadata-files: [nbdev.yml]