project:
  type: website

format:
  html:
    author: "Benedict Thekkel"
    theme:
      light: flatly
      dark: darkly
    css: styles.css
    toc: true
    
website:
  image: "Logo.svg"
  favicon: "favi.svg"
  reader-mode: true
  back-to-top-navigation: true
  page-navigation: true
  twitter-card: true
  open-graph: true
  repo-actions: [edit, issue]
  search:
    location: navbar
    type: overlay

  navbar:
    background: dark
    logo: "Logo.svg"
    logo-alt: "Benedict Thekkel"
    collapse-below: lg
    title: false
    left:

      - text: "Deep Learning"
        menu:
        - text: "Fast AI course"
          href: https://bthek1.github.io/FastAI_course/
        - text: "DL Methods"
          href: https://bthek1.github.io/DL_methods/
        - text: "DL Tasks"
          href: https://bthek1.github.io/DL_tasks/
          
      - text: "ML Techniques"
        menu:
        - text: "ML Methods"
          href: https://bthek1.github.io/ML_methods/
        - text: "Time series"
          href: https://bthek1.github.io/TimeSeriesML/
 
      - text: "Web"
        menu:
        - text: "Web Development"
          href: https://bthek1.github.io/WEB_doc/
        - text: "Front End"
          href: https://bthek1.github.io/Front_End/
        - text: "Back End"
          href: https://bthek1.github.io/Back_End/
        - text: "IaaS"
          href: https://bthek1.github.io/IaaS_docs/
          
          
      - text: "Tools"
