          href: https://bthek1.github.io/nbdevAuto/
        - text: "ROS 2"
          href: https://bthek1.github.io/ROS2_docs/

      - text: "Business"
        menu:
        - text: "Business Doc"
          href: https://bthek1.github.io/Business_doc/
        - text: "Ideas Doc"
          href: https://bthek1.github.io/Philosophy_doc/
        - text: "Finances"
          href: https://bthek1.github.io/Finances/ 
        - text: "Other"
